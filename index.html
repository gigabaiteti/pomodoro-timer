<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer by Gigabaite Tecnologia</title>
    <!-- Bootstrap 5.3.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 7.0.1 Free -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="pomodoro.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F8F9FA">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 px-4">
                <header class="text-center mb-4">
                    <img src="pomodoro.svg" height="70" />
                    <h1 class="display-5 fw-bold text-uppercase text-danger my-1" data-i18n="title">Pomodoro</h1>
                    <span class="badge bg-danger text-uppercase mb-4">Timer</span>
                    <div class="card mb-4 mode-container">
                        <ul class="list-group list-group-flush pt-2">
                            <li class="list-group-item text-center bg-transparent h2" id="mode-indicator">Foco</li>
                        </ul>
                    </div>                             
                </header>
                <main>
                    <!-- Timer -->
                    <div class="text-center mb-3 p-4 rounded-3 bg-body-tertiary timer-container border border-2 border-transparent">
                        <div class="display-1 fw-bold text-dark mb-4" id="timer" style="font-variant-numeric: tabular-nums;">25:00</div>
                        <div class="d-flex justify-content-center gap-2 flex-wrap">
                            <button id="start-btn" class="btn btn-primary btn-lg px-4">
                                <i class="fa-solid fa-play me-0 me-md-2"></i><span class="d-none d-md-inline" data-i18n="start">Iniciar</span>
                            </button>
                            <button id="pause-btn" class="btn btn-secondary btn-lg px-4" disabled>
                                <i class="fa-solid fa-pause me-0 me-md-2"></i><span class="d-none d-md-inline" data-i18n="pause">Pausar</span>
                            </button>
                            <button id="reset-btn" class="btn btn-danger btn-lg px-4">
                                <i class="fa-solid fa-rotate-right me-0 me-md-2"></i><span class="d-none d-md-inline" data-i18n="reset">Resetar</span>
                            </button>
                        </div>
                        <button id="settings-toggle-btn" class="btn btn-text text-muted text-uppercase mt-2 pb-0" title="Opções" data-bs-toggle="modal" data-bs-target="#settingsModal" data-i18n="settingsTitle">Opções</button>
                    </div>

                    <!-- Stats -->
                    <div class="card mb-3">
                        <div class="card-header text-uppercase text-center">
                            <span data-i18n="cycles">Concluído</span>
                        </div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item text-center"><span id="cycle-count" class="fw-bold h3 text-dark">0</span></li>
                        </ul>
                    </div>

                    <!-- History -->
                    <div class="card mb-4">
                        <div class="card-header text-uppercase text-center">
                            <span data-i18n="historyTitle">Histórico</span>                                  
                        </div>
                        <ul class="list-group list-group-flush" id="history-list">
                            <li class="list-group-item text-center" id="empty-history-msg">Nenhuma sessão registrada</li>
                        </ul>
                    </div>
                </main>
                <footer class="text-center my-4 text-muted small">
                    <a href="https://www.gigabaite.com.br/" target="_blank"><img src="gigabaite.svg" height="30" /></a>
                </footer>
            </div>
        </div>
    </div>

    <!-- Modal de Opções -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="settingsModalLabel" data-i18n="settingsTitle">Opções</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-6">
                            <label for="focus-duration" class="form-label" data-i18n="focusLabel">Foco (min)</label>
                            <input type="number" class="form-control text-center" id="focus-duration" value="25" min="1" max="60">
                        </div>
                        <div class="col-6">
                            <label for="break-duration" class="form-label" data-i18n="breakLabel">Pausa (min)</label>
                            <input type="number" class="form-control text-center" id="break-duration" value="5" min="1" max="30">
                        </div>
                    </div>
                    <div id="row">
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary w-100 mt-3" type="button" data-bs-toggle="dropdown" aria-expanded="false" data-i18n="languageLabel" title="Language">
                                Alterar Idioma
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#" onclick="changeLanguage('pt')">Português</a></li>
                                <li><a class="dropdown-item" href="#" onclick="changeLanguage('en')">English</a></li>
                                <li><a class="dropdown-item" href="#" onclick="changeLanguage('es')">Español</a></li>
                            </ul>
                        </div>                        
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary w-100" id="save-settings-btn" data-i18n="saveSettings">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Alerta/Confirmação (Genérico) -->
    <div class="modal fade" id="dialogModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="dialog-title">Aviso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <p id="dialog-message" class="mb-0"></p>
                </div>
                <div class="modal-footer justify-content-center border-top-0 pt-0">
                    <button type="button" class="btn btn-secondary" id="dialog-cancel-btn" data-bs-dismiss="modal" data-i18n="btnCancel">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="dialog-confirm-btn" data-i18n="btnOk">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3.2 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
